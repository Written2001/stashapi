name: Setup pinned Stash schema
description: Install the SDL parser and fetch the pinned Stash checkout
inputs:
  fetch-schema:
    description: Fetch the pinned Stash SDL checkout
    required: false
    default: 'true'
runs:
  using: composite
  steps:
    - name: Setup Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'

    - name: Install and verify SDL parser
      shell: bash
      run: |
        python -m pip install -r tools/requirements.txt
        python -c "import graphql; print('graphql-core', graphql.__version__)"
        python_executable="$(python -c 'import sys; print(sys.executable)')"
        echo "PYTHON=$python_executable" >> "$GITHUB_ENV"

    - name: Fetch pinned Stash schema
      if: ${{ inputs.fetch-schema == 'true' }}
      shell: bash
      run: |
        make fetch-stash-schema STASH_SOURCE_ROOT="$RUNNER_TEMP/stashapi-stash"
        make schema-environment STASH_SOURCE_ROOT="$RUNNER_TEMP/stashapi-stash" >> "$GITHUB_ENV"
