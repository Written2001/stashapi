name: Setup pinned Stash schema
description: Install the SDL parser and fetch the pinned Stash checkout
inputs:
  fetch-schema:
    description: Fetch the pinned Stash SDL checkout
    required: false
    default: 'true'
runs:
  using: composite
  steps:
    - name: Setup Python
      id: setup-python
      uses: actions/setup-python@v5
      with:
        python-version: '3.12'

    - name: Install and verify SDL parser
      shell: bash
      run: |
        "${{ steps.setup-python.outputs.python-path }}" -m pip install -r tools/requirements.txt
        "${{ steps.setup-python.outputs.python-path }}" -c "import graphql; print('graphql-core', graphql.__version__)"
        echo "PYTHON=${{ steps.setup-python.outputs.python-path }}" >> "$GITHUB_ENV"

    - name: Fetch pinned Stash schema
      if: ${{ inputs.fetch-schema == 'true' }}
      shell: bash
      run: |
        make fetch-stash-schema STASH_SOURCE_ROOT="$RUNNER_TEMP/stashapi-stash"
        make schema-environment STASH_SOURCE_ROOT="$RUNNER_TEMP/stashapi-stash" >> "$GITHUB_ENV"
