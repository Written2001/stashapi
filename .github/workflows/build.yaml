name: Build

on:
  push:
    branches: [main]
    paths:
      - DESCRIPTION
      - NAMESPACE
      - R/**
      - inst/**
      - man/**
      - tests/**
      - tools/**
      - README.md
  pull_request:
    branches: [main]
    paths:
      - DESCRIPTION
      - NAMESPACE
      - R/**
      - inst/**
      - man/**
      - tests/**
      - tools/**
      - README.md
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Setup R
        uses: r-lib/actions/setup-r@v2
        with:
          r-version: release
          use-public-rspm: true

      - name: Setup dependencies
        uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: |
            any::rcmdcheck
            any::roxygen2
            any::rmarkdown
            any::stringr
            any::tidyr
          needs: check

      - name: Check generated wrappers
        run: Rscript tools/check_generated.R

      - name: Check generated documentation
        run: Rscript tools/check_documentation.R

      - name: Build package
        run: R CMD build .

      - name: Upload source package
        uses: actions/upload-artifact@v4
        with:
          name: source-package
          path: '*.tar.gz'
