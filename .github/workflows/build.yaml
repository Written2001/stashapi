name: Build

on:
  push:
    branches: [main]
    paths:
      - DESCRIPTION
      - NAMESPACE
      - R/**
      - inst/**
      - man/**
      - tests/**
      - tools/**
      - Makefile
      - README.md
  pull_request:
    branches: [main]
    paths:
      - DESCRIPTION
      - NAMESPACE
      - R/**
      - inst/**
      - man/**
      - tests/**
      - tools/**
      - Makefile
      - README.md
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Setup Python dependencies
        run: python -m pip install -r tools/requirements.txt

      - name: Setup R
        uses: r-lib/actions/setup-r@v2
        with:
          r-version: release
          use-public-rspm: true

      - name: Setup dependencies
        uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: |
            any::rcmdcheck
            any::roxygen2
            any::rmarkdown
          needs: check

      - name: Fetch pinned Stash schema
        run: |
          make fetch-stash-schema STASH_SOURCE_ROOT="$RUNNER_TEMP/stashapi-stash"
          make schema-environment STASH_SOURCE_ROOT="$RUNNER_TEMP/stashapi-stash" >> "$GITHUB_ENV"

      - name: Check generated wrappers
        run: Rscript tools/check_generated.R

      - name: Check SDL parser
        run: make schema-source-check

      - name: Prepare schema compatibility baseline
        if: github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          git fetch --no-tags --depth=1 origin "$BASE_SHA"
          git show "$BASE_SHA:inst/extdata/schema.json" > "$RUNNER_TEMP/baseline-schema.json"

      - name: Check schema compatibility
        if: github.event_name == 'pull_request'
        env:
          STASH_SCHEMA_BASELINE: ${{ runner.temp }}/baseline-schema.json
          STASH_SCHEMA_COMPATIBILITY_OUTPUT: ${{ runner.temp }}/schema-compatibility.json
        run: make schema-compatibility-check

      - name: Upload schema compatibility report
        if: github.event_name == 'pull_request' && always()
        uses: actions/upload-artifact@v4
        with:
          name: schema-compatibility-report
          path: ${{ runner.temp }}/schema-compatibility.json
          if-no-files-found: ignore

      - name: Check generated documentation
        run: Rscript tools/check_documentation.R

      - name: Build package
        run: R CMD build .

      - name: Upload source package
        uses: actions/upload-artifact@v4
        with:
          name: source-package
          path: '*.tar.gz'
