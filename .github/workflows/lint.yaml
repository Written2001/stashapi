name: Lint

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: read

jobs:
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Detect lint-relevant changes
        id: changes
        if: github.event_name != 'workflow_dispatch'
        uses: dorny/paths-filter@v3
        with:
          filters: |
            lint:
              - 'R/**'
              - 'tests/**/*.R'
              - 'inst/**'
              - 'data-raw/**'
              - 'demo/**'
              - 'exec/**'
              - 'tools/**/*.R'
              - 'tools/.lintr'
              - 'vignettes/**/*.Rmd'
              - '.lintr'
              - 'DESCRIPTION'
              - 'renv.lock'
              - 'Makefile'

      - name: Skip lint for unrelated changes
        if: github.event_name != 'workflow_dispatch' && steps.changes.outputs.lint != 'true'
        run: echo 'No lint-relevant files changed; skipping R setup and linting.'

      - name: Setup R
        if: github.event_name == 'workflow_dispatch' || steps.changes.outputs.lint == 'true'
        uses: r-lib/actions/setup-r@v2
        with:
          r-version: release
          use-public-rspm: true

      - name: Setup dependencies
        if: github.event_name == 'workflow_dispatch' || steps.changes.outputs.lint == 'true'
        uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: any::lintr
          needs: check

      - name: Install package for linting
        if: github.event_name == 'workflow_dispatch' || steps.changes.outputs.lint == 'true'
        run: R CMD INSTALL -l "$(Rscript --vanilla -e 'source("renv/activate.R"); cat(.libPaths()[1])')" .

      - name: Lint package and tools
        if: github.event_name == 'workflow_dispatch' || steps.changes.outputs.lint == 'true'
        run: make lint
