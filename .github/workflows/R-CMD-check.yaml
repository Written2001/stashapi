name: R-CMD-check.yaml

on:
  push:
    branches: [ main ]
    paths:
      - DESCRIPTION
      - NAMESPACE
      - R/**
      - inst/**
      - man/**
      - tests/**
      - tools/**
      - Makefile
  pull_request:
    branches: [ main ]
    paths:
      - DESCRIPTION
      - NAMESPACE
      - R/**
      - inst/**
      - man/**
      - tests/**
      - tools/**
      - Makefile
  workflow_dispatch:

permissions:
  contents: read

jobs:
  R-CMD-check:
    runs-on: ${{ matrix.config.os }}
    name: ${{ matrix.config.os }} (${{ matrix.config.r }})
    strategy:
      fail-fast: false
      matrix:
        config:
          - {os: macos-latest,   r: 'release'}
          - {os: windows-latest, r: 'release'}
          - {os: ubuntu-latest,   r: 'devel', http-user-agent: 'release'}
          - {os: ubuntu-latest,   r: 'release'}
          - {os: ubuntu-latest,   r: 'oldrel-1'}

    # env:
    #   GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
    #   GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    #   R_KEEP_PKG_SOURCE: yes

    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Setup Python dependencies
        run: python -m pip install -r tools/requirements.txt

      - name: Setup R
        uses: r-lib/actions/setup-r@v2
        with:
          r-version: ${{ matrix.config.r }}
          http-user-agent: ${{ matrix.config.http-user-agent }}
          use-public-rspm: true

      - name: Setup Deps
        uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: |
            any::rcmdcheck
            any::roxygen2
            any::rmarkdown
          needs: check

      - name: Fetch pinned Stash schema
        run: |
          make fetch-stash-schema STASH_SOURCE_ROOT="$RUNNER_TEMP/stashapi-stash"
          make schema-environment STASH_SOURCE_ROOT="$RUNNER_TEMP/stashapi-stash" >> "$GITHUB_ENV"

      - name: Check generated documentation
        run: Rscript tools/check_documentation.R

      - name: Check SDL parser
        run: make schema-source-check

      - name: Check
        uses: r-lib/actions/check-r-package@v2
        with:
          upload-snapshots: true
          build_args: 'c("--no-manual","--compact-vignettes=gs+qpdf")'
