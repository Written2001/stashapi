name: Release

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing vMAJOR.MINOR.PATCH tag to release'
        required: true
        type: string

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref }}

      - name: Resolve release tag
        id: release
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            tag="${{ inputs.tag }}"
          else
            tag="${GITHUB_REF_NAME}"
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

      - name: Validate version and tag
        env:
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
        run: |
          version=$(sed -n 's/^Version:[[:space:]]*//p' DESCRIPTION)
          tag_version=${RELEASE_TAG#v}

          [[ "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || {
            echo "Release tag must use vMAJOR.MINOR.PATCH: $RELEASE_TAG"
            exit 1
          }
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || {
            echo "DESCRIPTION must use MAJOR.MINOR.PATCH: $version"
            exit 1
          }
          [[ "$version" == "$tag_version" ]] || {
            echo "Tag $RELEASE_TAG does not match DESCRIPTION version $version"
            exit 1
          }

      - name: Setup R
        uses: r-lib/actions/setup-r@v2
        with:
          r-version: release
          use-public-rspm: true

      - name: Setup dependencies
        uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: |
            any::rcmdcheck
            any::roxygen2
            any::rmarkdown
          needs: check

      - name: Setup pinned Stash schema
        uses: ./.github/actions/setup-stash-schema

      - name: Check generated artifacts
        run: make reproducibility-check

      - name: Build source package
        run: R CMD build .

      - name: Check source package
        run: R CMD check --no-manual --no-vignettes ./*.tar.gz

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ steps.release.outputs.tag }}
        run: gh release create "$RELEASE_TAG" ./*.tar.gz --generate-notes --title "$RELEASE_TAG"
