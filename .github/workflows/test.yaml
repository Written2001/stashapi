name: Test

on:
  push:
    branches: [main]
    paths:
      - DESCRIPTION
      - NAMESPACE
      - R/**
      - inst/**
      - tests/**
  pull_request:
    branches: [main]
    paths:
      - DESCRIPTION
      - NAMESPACE
      - R/**
      - inst/**
      - tests/**
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Setup R
        uses: r-lib/actions/setup-r@v2
        with:
          r-version: release
          use-public-rspm: true

      - name: Setup dependencies
        uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: any::testthat
          needs: check

      - name: Run tests
        run: testthat::test_local(reporter = "check")
        shell: Rscript {0}
